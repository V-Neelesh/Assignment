services:
  - type: web
    name: agency-app
    runtime: node
    plan: free
    buildCommand: |
      cd server && npm ci && npm run build
    startCommand: |
      cd server && node dist/server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: ./uploads
